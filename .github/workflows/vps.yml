name: VPS GETPOST

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Server region — chọn singapore để đỡ delay (mặc định)'
        required: false
        default: 'singapore'
        type: choice
        options:
          - singapore
          - auto
    schedule:
      - cron: "0 */5 * * *"

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true

env:
  REGION: ${{ inputs.region || 'singapore' }}
  BORE_SERVER: bore.pub  # anycast — singapore PoP gần nhất ~10-30ms, xa US ~200ms

jobs:
  build:
    runs-on: windows-latest  # GitHub hosted US/EU — muốn Singapore thật thì dùng self-hosted: runs-on: [self-hosted, singapore] (xem README)
    # Để dùng runner Singapore self-hosted, đổi thành: runs-on: [self-hosted, singapore]
    permissions:
      contents: write
    timeout-minutes: 1440

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Region — Singapore low delay
        run: |
          Write-Host "🌏 Region selected: $env:REGION"
          Write-Host "Runner location: GitHub hosted windows-latest (US/EU ~180ms delay)"
          Write-Host "Để có Singapore thật (5-20ms), cần self-hosted runner tại SG (Vultr/DigitalOcean ap-southeast-1) và đổi runs-on: [self-hosted, singapore]"
          if ($env:REGION -eq "singapore") { Write-Host "✅ Ưu tiên Singapore PoP bore.pub" }

      - name: Download and Extract Bore
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore

      - name: Enable RDP + Create Admin User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # Generate random strong password 14 chars to avoid brute force
          $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz0123456789!@#$%&*"
          $PASS = -join (1..14 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          # Ensure at least one of each class, regenerate if needed
          while ($PASS -notmatch "[A-Z]" -or $PASS -notmatch "[a-z]" -or $PASS -notmatch "[0-9]" -or $PASS -notmatch "[!@#$%&*]") {
            $PASS = -join (1..14 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $secPass = ConvertTo-SecureString $PASS -AsPlainText -Force
          New-LocalUser "admin" -Password $secPass -FullName "admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin"
          Add-LocalGroupMember -Group "Administrators" -Member "admin"
          echo "RDP_PASS=$PASS" >> $env:GITHUB_ENV
          Write-Host "✅ RDP user admin created with random password"

      - name: Tối ưu Registry 4K
        run: |
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord

      - name: Connect Singapore VPN (WARP) — không cần VPS riêng
        run: |
          Write-Host "🇸🇬 Connecting WARP Singapore..."
          try {
            winget install --id Cloudflare.Warp --silent --accept-package-agreements --accept-source-agreements | Out-Null
          } catch { choco install cloudflare-warp -y | Out-Null }
          $warpPath = "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (!(Test-Path $warpPath)) { $warpPath = "warp-cli" }
          & $warpPath --accept-tos register | Out-String
          & $warpPath --accept-tos set-mode warp | Out-String
          & $warpPath --accept-tos connect | Out-String
          Start-Sleep -Seconds 12
          # Force SG location if available
          try { & $warpPath --accept-tos set-location SG | Out-String } catch {}
          Invoke-WebRequest -Uri https://1.1.1.1/cdn-cgi/trace -UseBasicParsing | Select-Object -ExpandProperty Content | Write-Host
          Write-Host "✅ WARP Singapore connected — IP giờ là SG"

      - name: Monitor Bore Stream & Force Update File
        run: |
          $PASS = $env:RDP_PASS
          if (-not $PASS) {
            # Fallback generate if env missing (manual dispatch without previous step)
            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz0123456789!@#$%&*"
            $PASS = -join (1..14 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $USER = "admin"
          $lastFullAddress = ""

          # Cấu hình Git ép buộc
          git config --global user.name "GetPostVPS"
          git config --global user.email "bot@getpost.vn"
          git config --global core.autocrlf false

          Write-Host "🚀 Đang truy quét Stream của Bore... Đợi Port về nhé đại ca!"

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\bore\bore.exe"
          $psi.Arguments = "local 3389 --to bore.pub"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $process = [System.Diagnostics.Process]::Start($psi)

          while (!$process.HasExited) {
              $line = $process.StandardOutput.ReadLine()
              if ($line) { Write-Host "[bore] $line" }
              # Bore v0.5.1 in: "listening at bore.pub:PORT"; bản cũ: "remote forwarding at bore.pub:PORT"
              if ($line -match "(?:listening at|remote forwarding at) (bore\.pub:\d+)") {
                  $fullAddress = $matches[1]
                  $portOnly = $fullAddress.Split(':')[1]

                  if ($fullAddress -ne $lastFullAddress) {
                      $lastFullAddress = $fullAddress
                      
                      if (Test-Path "rdp_info.txt") { Remove-Item "rdp_info.txt" -Force }

                      $createdAt = (Get-Date).ToString('HH:mm:ss dd/MM/yyyy')
                      $reportLines = @(
                        '=======================================================',
                        'RDP INFO',
                        '=======================================================',
                        "FULL ADDRESS   : $fullAddress",
                        "PORT           : $portOnly",
                        'HOST           : bore.pub',
                        '-------------------------------------------------------',
                        "Username       : $USER",
                        "Password       : $PASS",
                        "Created        : $createdAt",
                        '======================================================='
                      )
                      $report = ($reportLines -join "`r`n")
                      [System.IO.File]::WriteAllText("$(Get-Location)\rdp_info.txt", $report)
                      
                      # Commit và Push bằng lệnh Force
                      git checkout main
                      git add rdp_info.txt
                      git commit -m "Update RDP: $portOnly [skip ci]"
                      git push origin main --force
                      
                      Write-Host "✅ ĐÃ ÉP CẬP NHẬT REPO: $fullAddress"
                  }
              }
              Start-Sleep -Milliseconds 200
          }
